
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: mtm-app
  restart: unless-stopped
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - mtm

x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  app:
    <<: *app
    container_name: mtm-app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app

  queue:
    <<: *app
    container_name: mtm-queue
    command: php artisan queue:work redis --tries=3 --backoff=5
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue

  scheduler:
    <<: *app
    container_name: mtm-scheduler
    command: php artisan schedule:work
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler

  nginx:
    image: nginx:1.27-alpine
    container_name: mtm-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mtm

  mysql:
    image: mysql:8.4
    container_name: mtm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mtm

  redis:
    image: redis:7.4-alpine
    container_name: mtm-redis
    restart: unless-stopped
    # appendonly: guarda a disco, así un reinicio no pierde los jobs encolados
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mtm

volumes:
  mysql-data:
  redis-data:

networks:
  mtm:
